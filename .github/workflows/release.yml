name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Verify version and pack
        run: |
          test "v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")" = "$GITHUB_REF_NAME"
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "DSH 模型链 $GITHUB_REF_NAME" --notes-file CHANGELOG.md
